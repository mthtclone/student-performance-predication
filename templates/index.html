<!doctype html>
<html>
    <head>
        <title>Student Performance Predictor</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    </head>

    <body>
        <header>
            <h1>Student Performance Prediction</h1>
            <p>Predict student grades using machine learning</p>
        </header>

        <div class="container">
            <div class="card">
                <h2>Enter Student Details</h2>

                <form>
                    <label> Study Hours </label>

                    <input type="number" placeholder="Example: 5" />

                    <label> Attendance (%) </label>

                    <input type="number" placeholder="Example: 90" />

                    <label> Assignment Score </label>

                    <input type="number" placeholder="Example: 85" />

                    <label> Previous Score </label>

                    <input type="number" placeholder="Example: 80" />

                    <button>Predict Grade</button>
                </form>
            </div>

            <div class="card result">
                <h2>Prediction Result</h2>

                <div class="prediction">A</div>

                <p>Predicted Grade</p>
            </div>
        </div>

        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    </body>
</html>
