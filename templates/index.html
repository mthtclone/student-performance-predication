<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Student Performance Predictor</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    </head>

    <body>
        <header>
            <div class="header-row">
                <div>
                    <h1>Student Performance Prediction</h1>
                    <p class="subtitle">Enter a student's record to forecast their grade</p>
                </div>
                <a class="history-link" href="{{ url_for('history') }}">View prediction history</a>
            </div>
        </header>

        <main class="container">
            <section class="card record-card">
                <h2>Student Record</h2>

                <form id="predict-form">
                    <label for="study-hours">Study hours <span>per day</span></label>
                    <input
                        id="study-hours"
                        name="study_hours"
                        type="number"
                        step="0.1"
                        min="0"
                        placeholder="5"
                        required
                    />

                    <label for="attendance">Attendance <span>percent</span></label>
                    <input
                        id="attendance"
                        name="attendance"
                        type="number"
                        step="1"
                        min="0"
                        max="100"
                        placeholder="90"
                        required
                    />

                    <label for="assignment-score">Assignment score <span>out of 100</span></label>
                    <input
                        id="assignment-score"
                        name="assignment_score"
                        type="number"
                        step="1"
                        min="0"
                        max="100"
                        placeholder="85"
                        required
                    />

                    <label for="previous-score">Previous score <span>out of 100</span></label>
                    <input
                        id="previous-score"
                        name="previous_score"
                        type="number"
                        step="1"
                        min="0"
                        max="100"
                        placeholder="80"
                        required
                    />

                    <button type="submit">Predict grade</button>
                    <p id="form-error" class="form-error" hidden></p>
                </form>
            </section>

            <section class="card result-card">
                <h2>Prediction</h2>

                <div class="stamp">
                    <div id="prediction" class="prediction">&mdash;</div>
                    <p id="prediction-label" class="prediction-label">
                        Fill in the form to see a prediction
                    </p>
                </div>

                <div class="grade-scale" aria-hidden="true">
                    <span class="band band-a" data-grade="A">A</span>
                    <span class="band band-b" data-grade="B">B</span>
                    <span class="band band-c" data-grade="C">C</span>
                    <span class="band band-d" data-grade="D">D</span>
                    <span class="band band-f" data-grade="F">F</span>
                </div>
            </section>
        </main>

        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    </body>
</html>
